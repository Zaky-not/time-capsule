<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>YouTube Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    iframe {
      width: 80vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://www.youtube.com/embed/MsinQEe4swQ"
    title="YouTube Test"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

</body>
</html>
